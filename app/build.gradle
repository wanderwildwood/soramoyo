plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Read signing config from local.properties (gitignored).
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def prop = { String key, String fallback -> localProps.getProperty(key, fallback) }

android {
    namespace 'org.ok1cdj.kradar'
    compileSdk 37

    defaultConfig {
        applicationId "org.ok1cdj.kradar"
        minSdk 29
        targetSdk 37
        versionCode 4
        versionName "1.3"
    }

    // Reuse the SAME keystore for every build, or app updates fail with
    // "signatures do not match". Keystore + passwords live outside the repo.
    def storeFilePath = prop('signing.storeFile', '')
    if (storeFilePath && rootProject.file(storeFilePath).exists()) {
        signingConfigs {
            release {
                storeFile rootProject.file(storeFilePath)
                storePassword prop('signing.storePassword', '')
                keyAlias prop('signing.keyAlias', '')
                keyPassword prop('signing.keyPassword', '')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (storeFilePath && rootProject.file(storeFilePath).exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        buildConfig true // expose VERSION_NAME for the About dialog
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

// AGP 9 built-in Kotlin: jvmTarget is set via the kotlin compilerOptions DSL
// (the old android.kotlinOptions block was removed).
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // Mudita Mindful Design — e-ink Compose components (no ripple, jump-scroll).
    // Coordinate 'MMD' redirects to the Android artifact 'MMD-android' via
    // Gradle module metadata; resolved from Maven Central.
    implementation 'com.mudita:MMD:1.0.2'

    // Compose (BOM pins the 1.7.x line that MMD-android 1.0.2 requires).
    implementation platform("androidx.compose:compose-bom:${rootProject.ext.compose_bom_version}")
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Networking — plain REST (RainViewer), no Play Services.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
